name: Android Build

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  # 🚀 Server/Website Trigger
  repository_dispatch:
    types: [build-app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      - name: Inject Website Data
        run: |
          echo "Building App Name: ${{ github.event.client_payload.app_name }}"
          echo "Target Web URL: ${{ github.event.client_payload.web_url }}"

      - name: Get Packages
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build APK
        working-directory: builder/android_template
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: builder/android_template/build/app/outputs/flutter-apk/app-release.apk

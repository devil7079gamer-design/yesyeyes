name: Multi-Platform App Builder

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  # 🚀 Dynamic Trigger from Website / Server
  repository_dispatch:
    types: [build-app]

jobs:
  # =============================================================
  # JOB 1: BUILD ANDROID APK
  # =============================================================
  build-android:
    if: github.event.client_payload.platform == 'android' || github.event.client_payload.platform == 'both' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Dependencies
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: builder/android_template
        run: |
          flutter build apk --release --dart-define=WEB_URL="${{ github.event.client_payload.web_url }}" --dart-define=APP_NAME="${{ github.event.client_payload.app_name }}"

      - name: Prepare APK File & Send To Server
        run: |
          RAW_NAME="${{ github.event.client_payload.app_name || 'app' }}"
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          APK_NAME="${SAFE_NAME}-release.apk"
          
          cp builder/android_template/build/app/outputs/flutter-apk/app-release.apk "./$APK_NAME"
          
          echo "Sending $APK_NAME to server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: $APK_NAME" \
            --data-binary "@$APK_NAME"

  # =============================================================
  # JOB 2: BUILD WINDOWS EXE (PC APP)
  # =============================================================
  build-windows:
    if: github.event.client_payload.platform == 'windows' || github.event.client_payload.platform == 'both' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop Build
        run: flutter config --enable-windows-desktop

      - name: Inject Missing Windows Configuration
        working-directory: builder/android_template
        run: flutter create --platforms=windows .

      - name: Get Dependencies
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build Windows Release Executable
        working-directory: builder/android_template
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          CFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          flutter build windows --release --dart-define=WEB_URL="${{ github.event.client_payload.web_url }}" --dart-define=APP_NAME="${{ github.event.client_payload.app_name }}"

      - name: Rename Executable & Package Zip
        shell: powershell
        run: |
          $rawName = "${{ github.event.client_payload.app_name }}"
          if ([string]::IsNullOrWhiteSpace($rawName)) { $rawName = "VexApp" }
          $safeName = $rawName -replace '[^a-zA-Z0-9_-]', '_'
          
          $buildDir = "builder/android_template/build/windows/x64/runner/Release"
          
          $exeFile = Get-ChildItem -Path $buildDir -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
              Rename-Item -Path $exeFile.FullName -NewName "$safeName.exe"
          }
          
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$safeName-windows.zip"

      - name: Send Windows Zip Direct To Server
        shell: bash
        run: |
          RAW_NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          ZIP_NAME="${SAFE_NAME}-windows.zip"
          
          echo "Sending $ZIP_NAME to server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: $ZIP_NAME" \
            --data-binary "@$ZIP_NAME"

name: Vex Multi-Platform Universal Engine

on:
  repository_dispatch:
    types: [trigger-build, build-app]
  workflow_dispatch:

jobs:
  # =============================================================
  # 1. ANDROID ENGINE (Direct .APK & Play Store .AAB)
  # =============================================================
  build-android:
    if: |
      github.event.client_payload.platform == 'apk' || 
      github.event.client_payload.platform == 'aab' ||
      github.event.client_payload.platform == 'android' ||
      github.event.client_payload.targetPlatform == 'apk' || 
      github.event.client_payload.targetPlatform == 'aab' ||
      (!github.event.client_payload.platform && !github.event.client_payload.targetPlatform)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP / Website URL
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          DIST_FOLDER="${{ github.event.client_payload.dist_folder }}"
          ROOT_FOLDER="${{ github.event.client_payload.root_folder }}"
          IS_NESTED="${{ github.event.client_payload.is_nested }}"
          
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Fetching user package from: $FILE_URL"
            curl -s -L -o uploaded_source.zip "$FILE_URL" || true
            
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              echo "[VEX ENGINE] Unpacking archive..."
              mkdir -p temp_extracted_zip
              unzip -o uploaded_source.zip -d temp_extracted_zip/
              
              TARGET_DIR="temp_extracted_zip"
              if [ "$IS_NESTED" == "true" ] && [ -n "$ROOT_FOLDER" ]; then
                TARGET_DIR="temp_extracted_zip/$ROOT_FOLDER"
              fi
              
              if [ -n "$DIST_FOLDER" ] && [ -d "$TARGET_DIR/$DIST_FOLDER" ]; then
                TARGET_DIR="$TARGET_DIR/$DIST_FOLDER"
              fi
              
              cp -r $TARGET_DIR/* builder/android_template/assets/www/
              rm -rf temp_extracted_zip
            else
              echo "[VEX ENGINE] Single HTML file detected."
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "[VEX ENGINE] Web URL Mode Active."
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      # FIXED KEYSTORE GENERATOR (MATCHES ALIAS: vexkey AND PASSWORD: 123456)
      - name: Generate Permanent Vex Signing Keystore
        run: |
          mkdir -p builder/android_template/android/app
          rm -f builder/android_template/android/app/vex-key.jks
          keytool -genkey -v -keystore builder/android_template/android/app/vex-key.jks \
            -storepass 123456 -keypass 123456 -alias vexkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VexApp, OU=VexEngine, O=Vex, L=City, S=State, C=US"

      - name: Build Android Packages (.APK and .AAB)
        working-directory: builder/android_template
        run: |
          URL="${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          FILE_URL="${{ github.event.client_payload.file_url }}"
          ENTRY_PATH="${{ github.event.client_payload.entry_path || 'index.html' }}"
          PLATFORM="${{ github.event.client_payload.platform || github.event.client_payload.targetPlatform || 'apk' }}"
          SAFE_NAME=$(echo "$NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          
          flutter pub get
          
          if [ "$PLATFORM" == "aab" ]; then
            echo "[VEX ENGINE] Compiling Google Play Store Bundle (.AAB)..."
            flutter build appbundle --release \
              --dart-define=WEB_URL="$URL" \
              --dart-define=APP_NAME="$NAME" \
              --dart-define=FILE_URL="$FILE_URL" \
              --dart-define=ENTRY_PATH="$ENTRY_PATH" \
              --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
            
            mv build/app/outputs/bundle/release/app-release.aab "${SAFE_NAME}.aab"
            echo "FINAL_FILE=${SAFE_NAME}.aab" >> $GITHUB_ENV
            echo "FILE_PATH=builder/android_template/${SAFE_NAME}.aab" >> $GITHUB_ENV
          else
            echo "[VEX ENGINE] Compiling Direct Mobile App (.APK)..."
            flutter build apk --release \
              --dart-define=WEB_URL="$URL" \
              --dart-define=APP_NAME="$NAME" \
              --dart-define=FILE_URL="$FILE_URL" \
              --dart-define=ENTRY_PATH="$ENTRY_PATH" \
              --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
            
            mv build/app/outputs/flutter-apk/app-release.apk "${SAFE_NAME}.apk"
            echo "FINAL_FILE=${SAFE_NAME}.apk" >> $GITHUB_ENV
            echo "FILE_PATH=builder/android_template/${SAFE_NAME}.apk" >> $GITHUB_ENV
          fi

      - name: Push Android Binary Direct to Express Server
        run: |
          echo "[VEX ENGINE] Sending ${{ env.FINAL_FILE }} to Express Server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.FINAL_FILE }}" \
            --data-binary "@${{ env.FILE_PATH }}"

      - name: Backup Android Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-Android-Build
          path: "builder/android_template/*.*"
          if-no-files-found: warn

  # =============================================================
  # 2. WINDOWS ENGINE (Direct .EXE Executable & Setup Installer)
  # =============================================================
  build-windows:
    if: |
      github.event.client_payload.platform == 'windows' || 
      github.event.client_payload.targetPlatform == 'windows' ||
      github.event.client_payload.platform == 'exe'
    runs-on: windows-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Inno Setup Installer Compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Clean & Prepare Assets Directory
        shell: bash
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP File
        shell: bash
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Fetching Windows Source Code..."
            curl -s -L -o uploaded_source.zip "$FILE_URL"
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              unzip -o uploaded_source.zip -d builder/android_template/assets/www/
            else
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      - name: Compile Windows Native Binary & Build Setup Installer (.EXE)
        working-directory: builder/android_template
        shell: pwsh
        run: |
          $url = "${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          $rawName = "${{ github.event.client_payload.app_name || 'VexApp' }}"
          $fileUrl = "${{ github.event.client_payload.file_url }}"
          $entryPath = "${{ github.event.client_payload.entry_path || 'index.html' }}"
          $safeName = $rawName -replace '[^a-zA-Z0-9_-]', '_'
          
          flutter config --enable-windows-desktop
          flutter pub get
          
          echo "[VEX ENGINE] Compiling Windows Native Application..."
          flutter build windows --release `
            --dart-define=WEB_URL="$url" `
            --dart-define=APP_NAME="$rawName" `
            --dart-define=FILE_URL="$fileUrl" `
            --dart-define=ENTRY_PATH="$entryPath" `
            --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
          
          $releaseDir = Resolve-Path "build/windows/x64/runner/Release"
          $exePath = "$releaseDir\android_template.exe"
          
          if (Test-Path $exePath) {
              Rename-Item -Path $exePath -NewName "$safeName.exe"
          }
          
          $issContent = @"
          [Setup]
          AppName=$rawName
          AppVersion=1.0.0
          DefaultDirName={autopf}\$safeName
          DefaultGroupName=$rawName
          UninstallDisplayIcon={app}\$safeName.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=$safeName-Setup
          
          [Files]
          Source: "$releaseDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
          
          [Icons]
          Name: "{autoprograms}\$rawName"; Filename: "{app}\$safeName.exe"
          Name: "{commondesktop}\$rawName"; Filename: "{app}\$safeName.exe"
          
          [Run]
          Filename: "{app}\$safeName.exe"; Description: "Launch $rawName"; Flags: nowait postinstall skipifsilent
          "@
          
          Set-Content -Path "installer.iss" -Value $issContent
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          
          echo "SAFE_NAME=$safeName" >> $env:GITHUB_ENV

      - name: Push Windows Setup Installer (.EXE) to Express Server
        shell: bash
        run: |
          RAW_NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          EXE_NAME="${SAFE_NAME}-Setup.exe"
          
          echo "[VEX ENGINE] Uploading $EXE_NAME to Express Server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: $EXE_NAME" \
            --data-binary "@builder/android_template/$EXE_NAME"

      - name: Backup Windows Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-Windows-Build
          path: "builder/android_template/*-Setup.exe"
          if-no-files-found: warn

  # =============================================================
  # 3. iOS ENGINE (Direct App Store & Testing .IPA)
  # =============================================================
  build-ios:
    if: |
      github.event.client_payload.platform == 'ipa' || 
      github.event.client_payload.targetPlatform == 'ipa' ||
      github.event.client_payload.platform == 'ios' || 
      github.event.client_payload.targetPlatform == 'ios'
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP File
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Fetching iOS source code..."
            curl -s -L -o uploaded_source.zip "$FILE_URL"
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              unzip -o uploaded_source.zip -d builder/android_template/assets/www/
            else
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      - name: Build iOS Application Package (.IPA)
        working-directory: builder/android_template
        run: |
          URL="${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          FILE_URL="${{ github.event.client_payload.file_url }}"
          ENTRY_PATH="${{ github.event.client_payload.entry_path || 'index.html' }}"
          
          flutter pub get
          
          echo "[VEX ENGINE] Compiling iOS Runner App..."
          flutter build ios --release --no-codesign \
            --dart-define=WEB_URL="$URL" \
            --dart-define=APP_NAME="$NAME" \
            --dart-define=FILE_URL="$FILE_URL" \
            --dart-define=ENTRY_PATH="$ENTRY_PATH" \
            --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
          
          SAFE_NAME=$(echo "$NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r "${SAFE_NAME}-iOS.ipa" Payload
          
          echo "IPA_FILE=${SAFE_NAME}-iOS.ipa" >> $GITHUB_ENV

      - name: Push iOS IPA Package Direct to Express Server
        run: |
          echo "[VEX ENGINE] Uploading ${{ env.IPA_FILE }} to Express Server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.IPA_FILE }}" \
            --data-binary "@builder/android_template/${{ env.IPA_FILE }}"

      - name: Backup iOS Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-iOS-Build
          path: "builder/android_template/*.ipa"
          if-no-files-found: warn

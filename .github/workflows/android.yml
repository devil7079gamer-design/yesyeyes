name: Multi-Platform App Builder

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  # 🚀 Website/Server Trigger Event
  repository_dispatch:
    types: [build-app]

jobs:
  # =============================================================
  # JOB 1: BUILD ANDROID APK
  # =============================================================
  build-android:
    if: github.event.client_payload.platform == 'android' || github.event.client_payload.platform == 'both' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Dependencies
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: builder/android_template
        run: flutter build apk --release

      - name: Prepare APK File
        run: |
          cp builder/android_template/build/app/outputs/flutter-apk/app-release.apk ./app-release.apk

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app-release.apk

      - name: Send APK Direct To Server
        run: |
          echo "Sending app-release.apk to Pterodactyl server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: app-release.apk" \
            --data-binary "@app-release.apk"

  # =============================================================
  # JOB 2: BUILD WINDOWS EXE (PC APP)
  # =============================================================
  build-windows:
    if: github.event.client_payload.platform == 'windows' || github.event.client_payload.platform == 'both' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop Build
        run: flutter config --enable-windows-desktop

      - name: Inject Missing Windows Configuration
        working-directory: builder/android_template
        run: flutter create --platforms=windows .

      - name: Get Dependencies
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build Windows Release Executable
        working-directory: builder/android_template
        run: flutter build windows --release

      - name: Compress Executable Folder
        shell: powershell
        run: |
          Compress-Archive -Path "builder/android_template/build/windows/x64/runner/Release\*" -DestinationPath "app-windows.zip"

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: app-windows.zip

      - name: Send Windows Zip Direct To Server
        shell: bash
        run: |
          echo "Sending app-windows.zip to Pterodactyl server..."
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: app-windows.zip" \
            --data-binary "@app-windows.zip"

name: Vex Multi-Platform Universal Engine

on:
  repository_dispatch:
    types: [trigger-build, build-app]
  workflow_dispatch:

jobs:
  # =============================================================
  # 1. ANDROID ENGINE (APK & Play Store .AAB)
  # =============================================================
  build-android:
    if: |
      github.event.client_payload.platform == 'apk' || 
      github.event.client_payload.platform == 'aab' ||
      github.event.client_payload.targetPlatform == 'apk' || 
      github.event.client_payload.targetPlatform == 'aab' ||
      (!github.event.client_payload.platform && !github.event.client_payload.targetPlatform)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP File
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Custom code file detected. Fetching: $FILE_URL"
            curl -s -L -o uploaded_source.zip "$FILE_URL" || true
            
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              echo "[VEX ENGINE] Unpacking user web project ZIP..."
              unzip -o uploaded_source.zip -d builder/android_template/assets/www/
            else
              echo "[VEX ENGINE] Single file detected. Setting as primary index..."
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "[VEX ENGINE] No custom file uploaded. Defaulting to Web URL mode."
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      - name: Download & Setup User App Icon Dynamic
        run: |
          mkdir -p builder/android_template/assets
          ICON_URL="${{ github.event.client_payload.icon_url }}"
          
          if [ -n "$ICON_URL" ] && [ "$ICON_URL" != "null" ]; then
            curl -s -L -o builder/android_template/assets/user_icon.png "$ICON_URL" || true
          fi
          
          if [ -f builder/android_template/assets/user_icon.png ] && [ -s builder/android_template/assets/user_icon.png ]; then
            echo "[VEX ENGINE] Custom icon found. Generating launcher icons..."
            cd builder/android_template
            flutter pub get || true
            dart run flutter_launcher_icons:main || true
          else
            echo "[VEX ENGINE] No custom icon provided. Proceeding with standard build."
          fi

      - name: Build Android APK / AAB Binary
        working-directory: builder/android_template
        run: |
          URL="${{ github.event.client_payload.app_url }}"
          NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          FILE_URL="${{ github.event.client_payload.file_url }}"
          ENTRY_PATH="${{ github.event.client_payload.entry_path || 'index.html' }}"
          PLATFORM="${{ github.event.client_payload.platform || 'apk' }}"
          VERSION="${{ github.event.client_payload.app_version || '1.0.0' }}"
          
          if [ "$PLATFORM" = "aab" ]; then
            flutter build appbundle --release \
              --dart-define=WEB_URL="$URL" \
              --dart-define=APP_NAME="$NAME" \
              --dart-define=FILE_URL="$FILE_URL" \
              --dart-define=ENTRY_PATH="$ENTRY_PATH" \
              --dart-define=APP_VERSION="$VERSION" \
              --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
            
            BUILD_PATH="build/app/outputs/bundle/release/app-release.aab"
          else
            flutter build apk --release \
              --dart-define=WEB_URL="$URL" \
              --dart-define=APP_NAME="$NAME" \
              --dart-define=FILE_URL="$FILE_URL" \
              --dart-define=ENTRY_PATH="$ENTRY_PATH" \
              --dart-define=APP_VERSION="$VERSION" \
              --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
            
            BUILD_PATH="build/app/outputs/flutter-apk/app-release.apk"
          fi

          EXPECTED_NAME="${{ github.event.client_payload.expected_filename }}"
          if [ -z "$EXPECTED_NAME" ] || [ "$EXPECTED_NAME" = "null" ]; then
            RAW_NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
            SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
            EXPECTED_NAME="${SAFE_NAME}-release.apk"
          fi

          cp "$BUILD_PATH" "../../${EXPECTED_NAME}"
          echo "FINAL_FILE_NAME=${EXPECTED_NAME}" >> $GITHUB_ENV

      - name: Push Android Binary to VPS Server
        run: |
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.FINAL_FILE_NAME }}" \
            --data-binary "@${{ env.FINAL_FILE_NAME }}"

      - name: Upload Android Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-Android-Build
          path: "${{ env.FINAL_FILE_NAME }}"
          if-no-files-found: warn

  # =============================================================
  # 2. WINDOWS ENGINE (STANDALONE .EXE INSTALLER)
  # =============================================================
  build-windows:
    if: |
      github.event.client_payload.platform == 'windows' || 
      github.event.client_payload.targetPlatform == 'windows' ||
      github.event.client_payload.platform == 'exe' || 
      github.event.client_payload.targetPlatform == 'exe'
    runs-on: windows-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Download & Extract User Code ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "builder\\android_template\\assets\\www"
          $fileUrl = "${{ github.event.client_payload.file_url }}"
          
          if ($fileUrl -and $fileUrl -ne "null") {
            Invoke-WebRequest -Uri $fileUrl -OutFile "uploaded_source.zip"
            Expand-Archive -Path "uploaded_source.zip" -DestinationPath "builder\\android_template\\assets\\www" -Force
            echo "HAS_FILE=true" >> $env:GITHUB_ENV
          } else {
            echo "HAS_FILE=false" >> $env:GITHUB_ENV
          }

      - name: Build Windows Application
        working-directory: builder/android_template
        shell: powershell
        run: |
          $url = "${{ github.event.client_payload.app_url }}"
          $name = "${{ github.event.client_payload.app_name || 'VexApp' }}"
          $fileUrl = "${{ github.event.client_payload.file_url }}"
          $version = "${{ github.event.client_payload.app_version || '1.0.0' }}"
          
          flutter pub get
          flutter build windows --release `
            --dart-define=WEB_URL="$url" `
            --dart-define=APP_NAME="$name" `
            --dart-define=FILE_URL="$fileUrl" `
            --dart-define=APP_VERSION="$version" `
            --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"

      - name: Package Executable into Setup via Inno Setup
        shell: powershell
        run: |
          $rawName = "${{ github.event.client_payload.app_name || 'VexApp' }}"
          $version = "${{ github.event.client_payload.app_version || '1.0.0' }}"
          $safeName = $rawName -replace '[^a-zA-Z0-9_-]', '_'
          
          $expectedName = "${{ github.event.client_payload.expected_filename }}"
          if (-not $expectedName -or $expectedName -eq "null") {
            $expectedName = "$safeName-Setup.exe"
          }
          
          $issContent = @"
          [Setup]
          AppName=$rawName
          AppVersion=$version
          DefaultDirName={autopf}\\$safeName
          DefaultGroupName=$rawName
          OutputDir=.
          OutputBaseFilename=$($expectedName.Replace('.exe',''))
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "builder\\android_template\\build\\windows\\x64\\runner\\Release\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{autoprograms}\\$safeName"; Filename: "{app}\\runner.exe"
          Name: "{commondesktop}\\$safeName"; Filename: "{app}\\runner.exe"

          [Run]
          Filename: "{app}\\runner.exe"; Description: "Launch App"; Flags: nowait postinstall skipifsilent
          "@
          
          Set-Content -Path "installer.iss" -Value $issContent
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer.iss
          
          echo "FINAL_EXE_NAME=$expectedName" >> $env:GITHUB_ENV

      - name: Push Windows Setup to VPS Server
        shell: bash
        run: |
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.FINAL_EXE_NAME }}" \
            --data-binary "@${{ env.FINAL_EXE_NAME }}"

      - name: Upload Windows Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-Windows-Build
          path: "*Setup.exe"
          if-no-files-found: warn

  # =============================================================
  # 3. iOS ENGINE (APP STORE READY .IPA)
  # =============================================================
  build-ios:
    if: |
      github.event.client_payload.platform == 'ipa' || 
      github.event.client_payload.targetPlatform == 'ipa' ||
      github.event.client_payload.platform == 'appstore' || 
      github.event.client_payload.targetPlatform == 'appstore' ||
      github.event.client_payload.platform == 'ios' || 
      github.event.client_payload.targetPlatform == 'ios'
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP File
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Downloading user asset for iOS..."
            curl -s -L -o uploaded_source.zip "$FILE_URL"
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              unzip -o uploaded_source.zip -d builder/android_template/assets/www/
            else
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      - name: Fetch Dependencies
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build iOS IPA Package
        working-directory: builder/android_template
        run: |
          URL="${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          FILE_URL="${{ github.event.client_payload.file_url }}"
          VERSION="${{ github.event.client_payload.app_version || '1.0.0' }}"
          
          flutter build ios --release --no-codesign \
            --dart-define=WEB_URL="$URL" \
            --dart-define=APP_NAME="$NAME" \
            --dart-define=FILE_URL="$FILE_URL" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
          
          EXPECTED_NAME="${{ github.event.client_payload.expected_filename }}"
          if [ -z "$EXPECTED_NAME" ] || [ "$EXPECTED_NAME" = "null" ]; then
            RAW_NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
            SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
            EXPECTED_NAME="${SAFE_NAME}-iOS.ipa"
          fi
          
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r "../../${EXPECTED_NAME}" Payload
          echo "IPA_FILE=${EXPECTED_NAME}" >> $GITHUB_ENV

      - name: Push iOS IPA Package to VPS Server
        run: |
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.IPA_FILE }}" \
            --data-binary "@${{ env.IPA_FILE }}"

      - name: Upload iOS Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-iOS-Build
          path: "*.ipa"
          if-no-files-found: warn

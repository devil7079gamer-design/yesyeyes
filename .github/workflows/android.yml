name: Vex Multi-Platform Universal Engine

on:
  repository_dispatch:
    types: [trigger-build, build-app, trigger-app-build]
  workflow_dispatch:

jobs:
  # =============================================================
  # 1. ANDROID ENGINE (APK & Play Store .AAB)
  # =============================================================
  build-android:
    if: |
      github.event.client_payload.platform == 'apk' || 
      github.event.client_payload.platform == 'aab' ||
      github.event.client_payload.targetPlatform == 'apk' || 
      github.event.client_payload.targetPlatform == 'aab' ||
      (!github.event.client_payload.platform && !github.event.client_payload.targetPlatform)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP File
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Custom code file detected. Fetching: $FILE_URL"
            curl -s -L --connect-timeout 30 --max-time 600 -o uploaded_source.zip "$FILE_URL" || true
            
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              echo "[VEX ENGINE] Unpacking user web project ZIP..."
              unzip -o uploaded_source.zip -d builder/android_template/assets/www/
            else
              echo "[VEX ENGINE] Single file detected. Setting as primary index..."
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "[VEX ENGINE] No custom file uploaded. Defaulting to Web URL mode."
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      - name: Download & Setup User App Icon (Safe Mode)
        run: |
          mkdir -p builder/android_template/assets
          ICON_URL="${{ github.event.client_payload.icon_url }}"
          if [ -z "$ICON_URL" ] || [ "$ICON_URL" == "null" ]; then
            ICON_URL="http://104.251.123.179:1747/user_icon.png"
          fi
          
          curl -s -L --max-time 20 -o builder/android_template/assets/user_icon.png "$ICON_URL" || true
          
          if [ ! -s builder/android_template/assets/user_icon.png ]; then
            echo "[VEX ENGINE] Creating default placeholder icon..."
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > builder/android_template/assets/user_icon.png
          fi

          cd builder/android_template
          flutter pub get || true
          flutter pub run flutter_launcher_icons:main || true

      - name: Auto-Generate Play Store Keystore Certificate
        working-directory: builder/android_template/android/app
        run: |
          keytool -genkeypair -v \
            -keystore vex-key.jks \
            -storepass vexpassword123 \
            -alias vexkey \
            -keypass vexpassword123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Vex Developer, OU=VexEngine, O=VexSoftware, L=Lahore, S=Punjab, C=PK"

      - name: Build Android App Package (APK / Play Store AAB)
        working-directory: builder/android_template
        run: |
          URL="${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          FILE_URL="${{ github.event.client_payload.file_url }}"
          TARGET="${{ github.event.client_payload.platform || github.event.client_payload.targetPlatform || 'apk' }}"

          flutter pub get
          
          if [ "$TARGET" == "aab" ]; then
            flutter build appbundle --release \
              --dart-define=APP_NAME="$NAME" \
              --dart-define=WEB_URL="$URL" \
              --dart-define=FILE_URL="$FILE_URL" \
              --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
          else
            flutter build apk --release \
              --dart-define=APP_NAME="$NAME" \
              --dart-define=WEB_URL="$URL" \
              --dart-define=FILE_URL="$FILE_URL" \
              --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
          fi

      - name: Push Android Build to VPS Server
        run: |
          RAW_NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          TARGET="${{ github.event.client_payload.platform || github.event.client_payload.targetPlatform || 'apk' }}"
          
          if [ "$TARGET" == "aab" ]; then
            FILE_PATH="builder/android_template/build/app/outputs/bundle/release/app-release.aab"
            OUTPUT_NAME="${SAFE_NAME}-playstore.aab"
          else
            FILE_PATH="builder/android_template/build/app/outputs/flutter-apk/app-release.apk"
            OUTPUT_NAME="${SAFE_NAME}-release.apk"
          fi
          
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: $OUTPUT_NAME" \
            --data-binary "@$FILE_PATH"

      - name: Upload Android Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-Android-Build
          path: |
            builder/android_template/build/app/outputs/flutter-apk/*.apk
            builder/android_template/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # =============================================================
  # 2. WINDOWS ENGINE (DESKTOP .EXE INSTALLER INSIDE ZIP)
  # =============================================================
  build-windows:
    if: |
      github.event.client_payload.platform == 'exe' || 
      github.event.client_payload.targetPlatform == 'exe' ||
      github.event.client_payload.platform == 'windows' || 
      github.event.client_payload.targetPlatform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        shell: powershell
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "builder\android_template\assets\www"
          New-Item -ItemType Directory -Force -Path "builder\android_template\assets\www"

      - name: Read & Process Uploaded User Code / ZIP File
        shell: powershell
        run: |
          $fileUrl = "${{ github.event.client_payload.file_url }}"
          
          if (![string]::IsNullOrWhiteSpace($fileUrl) -and $fileUrl -ne "null") {
            Write-Host "[VEX ENGINE] Downloading user asset from: $fileUrl"
            Invoke-WebRequest -Uri $fileUrl -OutFile "uploaded_source.zip" -TimeoutSec 300 -ErrorAction SilentlyContinue
            
            try {
              Expand-Archive -Path "uploaded_source.zip" -DestinationPath "builder\android_template\assets\www" -Force
            } catch {
              Copy-Item -Path "uploaded_source.zip" -Destination "builder\android_template\assets\www\index.html" -Force
            }
            Add-Content -Path $env:GITHUB_ENV -Value "HAS_FILE=true"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "HAS_FILE=false"
          }

      - name: Download & Setup User App Icon (Windows Safe Mode)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "builder\android_template\assets"
          $iconUrl = "${{ github.event.client_payload.icon_url }}"
          if ([string]::IsNullOrWhiteSpace($iconUrl) -or $iconUrl -eq "null") {
            $iconUrl = "http://104.251.123.179:1747/user_icon.png"
          }
          
          try {
            Invoke-WebRequest -Uri $iconUrl -OutFile "builder\android_template\assets\user_icon.png" -TimeoutSec 15 -ErrorAction Stop
          } catch {
            Write-Host "[VEX ENGINE] Icon download failed or timed out. Using default PNG fallback..."
          }

          $iconPath = "builder\android_template\assets\user_icon.png"
          if (-not (Test-Path $iconPath) -or (Get-Item $iconPath).Length -eq 0) {
            $pngBytes = [System.Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==")
            [System.IO.File]::WriteAllBytes($iconPath, $pngBytes)
          }

          Set-Location "builder\android_template"
          flutter pub get
          try {
            flutter pub run flutter_launcher_icons:main
          } catch {
            Write-Host "[VEX ENGINE] Launcher icons skipped or warning ignored."
          }

      - name: Build Windows Executable
        working-directory: builder/android_template
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          CFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          $url = "${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          $name = "${{ github.event.client_payload.app_name }}"
          $fileUrl = "${{ github.event.client_payload.file_url }}"
          
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          
          flutter pub get
          flutter build windows --release --dart-define=WEB_URL="$url" --dart-define=APP_NAME="$name" --dart-define=FILE_URL="$fileUrl" --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"

      - name: Professional Packaging & Windows Installer (.EXE)
        shell: powershell
        run: |
          choco install innosetup -y
          
          $rawName = "${{ github.event.client_payload.app_name }}"
          if ([string]::IsNullOrWhiteSpace($rawName)) { $rawName = "VexApp" }
          $safeName = $rawName -replace '[^a-zA-Z0-9_-]', '_'
          
          $exePath = Get-ChildItem -Path "builder\android_template\build\windows\x64\runner\Release\*.exe" | Select-Object -First 1 -ExpandProperty Name
          if ([string]::IsNullOrWhiteSpace($exePath)) { $exePath = "builder.exe" }
          
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=$safeName Publisher, O=Vex Engine" -KeyUsage DigitalSignature -FriendlyName "$safeName Cert" -CertStoreLocation "Cert:\CurrentUser\My"
          
          $issContent = @"
          [Setup]
          AppName=$safeName
          AppVersion=1.0.0
          AppPublisher=Vex Software Engine
          DefaultDirName={autopf}\$safeName
          DefaultGroupName=$safeName
          OutputDir=.
          OutputBaseFilename=$safeName-Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=commandline dialog
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\$exePath

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional shortcuts:"
          Name: "quicklaunchicon"; Description: "Create a &Quick Launch shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Files]
          Source: "builder\android_template\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\$safeName"; Filename: "{app}\$exePath"
          Name: "{userdesktop}\$safeName"; Filename: "{app}\$exePath"; Tasks: desktopicon
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\$safeName"; Filename: "{app}\$exePath"; Tasks: quicklaunchicon

          [Run]
          Filename: "{app}\$exePath"; Description: "Launch $safeName"; Flags: nowait postinstall skipifsilent
          "@
          
          Set-Content -Path "installer.iss" -Value $issContent
          ISCC.exe installer.iss

      - name: Compress EXE Setup to ZIP (Bypass Chrome Warning)
        shell: powershell
        run: |
          $rawName = "${{ github.event.client_payload.app_name }}"
          if ([string]::IsNullOrWhiteSpace($rawName)) { $rawName = "VexApp" }
          $safeName = $rawName -replace '[^a-zA-Z0-9_-]', '_'
          
          $exeInstaller = "${safeName}-Setup.exe"
          $zipInstaller = "${safeName}-Setup.zip"
          
          if (Test-Path $exeInstaller) {
              Compress-Archive -Path $exeInstaller -DestinationPath $zipInstaller -Force
              Write-Host "[VEX ENGINE] Packaged $exeInstaller into $zipInstaller successfully!"
              Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipInstaller"
          } else {
              Write-Host "[VEX ENGINE] Installer EXE not found to zip!"
              exit 1
          }

      - name: Push Windows ZIP Package to VPS Server
        shell: bash
        run: |
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.ZIP_NAME }}" \
            --data-binary "@${{ env.ZIP_NAME }}"

      - name: Upload Windows Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-Windows-Build
          path: "*-Setup.zip"
          if-no-files-found: warn

  # =============================================================
  # 3. iOS ENGINE (APP STORE READY .IPA)
  # =============================================================
  build-ios:
    if: |
      github.event.client_payload.platform == 'ipa' || 
      github.event.client_payload.targetPlatform == 'ipa' ||
      github.event.client_payload.platform == 'ios' || 
      github.event.client_payload.targetPlatform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean & Prepare Assets Directory
        run: |
          rm -rf builder/android_template/assets/www
          mkdir -p builder/android_template/assets/www

      - name: Read & Process Uploaded User Code / ZIP File
        run: |
          FILE_URL="${{ github.event.client_payload.file_url }}"
          if [ -n "$FILE_URL" ] && [ "$FILE_URL" != "null" ]; then
            echo "[VEX ENGINE] Downloading user asset for iOS..."
            curl -s -L --max-time 600 -o uploaded_source.zip "$FILE_URL"
            if file uploaded_source.zip | grep -q 'Zip archive'; then
              unzip -o uploaded_source.zip -d builder/android_template/assets/www/
            else
              cp uploaded_source.zip builder/android_template/assets/www/index.html
            fi
            echo "HAS_FILE=true" >> $GITHUB_ENV
          else
            echo "HAS_FILE=false" >> $GITHUB_ENV
          fi

      - name: Fetch Dependencies
        working-directory: builder/android_template
        run: flutter pub get

      - name: Build iOS IPA Package
        working-directory: builder/android_template
        run: |
          URL="${{ github.event.client_payload.app_url || github.event.client_payload.web_url }}"
          NAME="${{ github.event.client_payload.app_name }}"
          FILE_URL="${{ github.event.client_payload.file_url }}"
          flutter build ios --release --no-codesign \
            --dart-define=WEB_URL="$URL" \
            --dart-define=APP_NAME="$NAME" \
            --dart-define=FILE_URL="$FILE_URL" \
            --dart-define=USE_LOCAL_FILE="${{ env.HAS_FILE }}"
          
          RAW_NAME="${{ github.event.client_payload.app_name || 'VexApp' }}"
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r "${SAFE_NAME}-iOS.ipa" Payload
          echo "IPA_FILE=${SAFE_NAME}-iOS.ipa" >> $GITHUB_ENV

      - name: Push iOS IPA Package to VPS Server
        run: |
          curl -X POST "http://104.251.123.179:1747/api/upload-build" \
            -H "x-file-name: ${{ env.IPA_FILE }}" \
            --data-binary "@${{ env.IPA_FILE }}"

      - name: Upload iOS Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VexApp-iOS-Build
          path: "builder/android_template/*.ipa"
          if-no-files-found: warn

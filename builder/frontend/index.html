<!DOCTYPE html>

<html>

<head>

    <title>WebsiteToApp Builder</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <h1>
        WebsiteToApp Builder
    </h1>


    <p>
        Convert your website into Android app
    </p>



    <input

        id="appName"

        placeholder="App Name"

    >



    <input

        id="websiteUrl"

        placeholder="Website URL"

    >



    <input

        id="packageName"

        placeholder="Package Name (com.example.app)"

    >



    <button onclick="createBuild()">

        Generate APK

    </button>



    <div id="result"></div>


</div>



<script src="app.js"></script>


</body>

</html>

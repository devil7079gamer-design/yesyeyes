<!DOCTYPE html>

<html>

<head>

    <title>
        Login - WebsiteToApp Builder
    </title>


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <h1>
        Login
    </h1>



    <input

        id="email"

        type="email"

        placeholder="Email"

    >



    <input

        id="password"

        type="password"

        placeholder="Password"

    >



    <button onclick="login()">

        Login

    </button>



    <p id="result"></p>



</div>



<script src="auth.js"></script>


</body>

</html>

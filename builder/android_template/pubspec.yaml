name: vex_app
description: Dynamic Webview App powered by Vex AI
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.7.0
  webview_windows: ^0.4.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # =============================================================
  # VEX ENGINE AUTOMATIC ASSET BINDING
  # =============================================================
  assets:
    - assets/user_icon.png
    - assets/image.png
    - assets/www/

# =============================================================
# LAUNCHER ICONS AUTOMATIC GENERATOR CONFIG
# =============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/user_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
